name: Check Oaktown Ops
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check model.js
          node --check app.js
      - name: Test calculations and workflow validation
        run: node --test tests/*.test.cjs
