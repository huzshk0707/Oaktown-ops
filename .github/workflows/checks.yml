name: Check Oaktown Ops
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check model.js
          node --check app.js
          node --check cloud.js
          node --check workspace.js
          node --check portfolio.js
          node --check renewal-rules.js
          node --check renewal-pdf.js
          node --check renewal-generator.js
          node --check notice-picker.js
          node --check task-intake-model.js
          node --check task-intake.js
          node --check eod-model.js
          node --check eod.js
          node --check workspace-theme.js
          node --check connections-model.js
          node --check connections.js
          node --check listing-guide-model.js
          node --check listing-guide.js
          node --check guided-workflows.js
          node --check application-guide.js
      - name: Test calculations and workflow validation
        run: node --test tests/*.test.cjs

  browser-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test tooling
        run: npm install --no-save --no-fund --no-audit @playwright/test@1.56.1
      - name: Install Chromium for visual PDF download tests
        run: npx playwright install --with-deps chromium
      - name: Serve app locally
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/oaktown-browser-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8765/generator.html >/dev/null
      - name: Test downloads, workflow navigation, cloud saves and sessions
        env:
          OAKTOWN_UI_SCREENSHOTS: '1'
        run: npx playwright test tests/*.e2e.spec.cjs --reporter=line --workers=1
      - name: Upload fictional UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oaktown-ui-review
          path: |
            test-results/ui-review/
            test-results/**/eod-*.png
            test-results/**/*-workspace.png
            test-results/**/*-connections.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oaktown-pdf-download-debug
          path: |
            test-results/
            /tmp/oaktown-browser-server.log
          if-no-files-found: ignore

  portfolio-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: oaktown_portfolio_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d oaktown_portfolio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: oaktown_portfolio_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable database test tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify historical portfolio migrations and existing workspace APIs
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f tests/portfolio-schema-setup.sql \
            -f supabase/migrations/20261026171822_oaktown_portfolio_relational_core_v05.sql \
            -f supabase/migrations/20261026171941_oaktown_portfolio_foreign_key_indexes_v05.sql \
            -f tests/portfolio-schema-check.sql \
            -f supabase/schema/task_intake_v1.sql \
            -f tests/task-intake-check.sql \
            -f supabase/schema/task_cleanup_v1.sql \
            -f tests/task-cleanup-check.sql \
            -f supabase/schema/today_task_editor_v1.sql \
            -f tests/today-task-editor-check.sql \
            -f supabase/schema/task_delete_archived_v1.sql \
            -f tests/task-delete-archived-check.sql
