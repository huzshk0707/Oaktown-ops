name: Check Oaktown Ops
on:
  push:
    branches: [main, feature/**]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check model.js
          node --check app.js
          node --check cloud.js
          node --check workspace.js
          node --check lead-rules.js
          node --check leads.js
          node --check portfolio.js
      - name: Test calculations and workflow validation
        run: node --test tests/*.test.cjs

  browser-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test tooling
        run: npm install --no-save --no-fund --no-audit @playwright/test@1.56.1
      - name: Install Chromium for visual PDF download tests
        run: npx playwright install --with-deps chromium
      - name: Serve app locally
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/oaktown-browser-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8765/generator.html >/dev/null
      - name: Test downloads, workflow navigation, cloud saves and sessions
        run: npx playwright test tests/*.e2e.spec.cjs --reporter=line --workers=1
      - name: Upload browser test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oaktown-pdf-download-debug
          path: |
            test-results/
            /tmp/oaktown-browser-server.log
          if-no-files-found: ignore

  lead-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: oaktown_schema_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: oaktown_schema_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable database test tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify staged guard and role permissions in disposable PostgreSQL
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/lead-schema-setup.sql
          if psql -v ON_ERROR_STOP=1 -f supabase/schema/lead_copilot_v05.sql > /tmp/staged-guard.log 2>&1; then
            echo 'Staged schema unexpectedly ran without the test marker'
            exit 1
          fi
          grep -F 'STAGED ONLY: reconcile Portfolio Master' /tmp/staged-guard.log
          psql -At -v ON_ERROR_STOP=1 -c "select to_regclass('public.leads') is null and to_regclass('public.lead_messages') is null and to_regclass('public.lead_property_interests') is null" | grep -qx t
          psql -v ON_ERROR_STOP=1 -c "SET oaktown.staged_test_only = 'isolated_ci'" -f supabase/schema/lead_copilot_v05.sql -f tests/lead-schema-check.sql

  portfolio-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: oaktown_portfolio_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d oaktown_portfolio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: oaktown_portfolio_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable database test tooling
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify historical portfolio migrations and existing workspace APIs
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f tests/portfolio-schema-setup.sql \
            -f supabase/migrations/20261026171822_oaktown_portfolio_relational_core_v05.sql \
            -f supabase/migrations/20261026171941_oaktown_portfolio_foreign_key_indexes_v05.sql \
            -f tests/portfolio-schema-check.sql
